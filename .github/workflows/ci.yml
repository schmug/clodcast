name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The heavy runtime deps (mlx-audio) are Apple-Silicon-only and won't install
      # on Linux, so CI installs only the dev tools. The pytest suite is invariant-only
      # by design — those heavy imports are function-local, so it needs neither MLX,
      # ffmpeg, nor the save-to-spotify CLI.
      # boto3 is the exception: it installs cleanly on Linux and the R2 tests
      # (tests/test_r2.py) import botocore at module top to build/catch ClientError,
      # so CI pulls it in to run the R2 invariant tests (slug/upsert/schema-conformance).
      # Pillow is the second: cover rendering is pure Pillow and resolve_font is
      # written to run off macOS precisely so this job can exercise it (#164). Without
      # it every cover test either fails or silently skips, and the cover ships to a
      # PUBLIC feed where a directory rejects the whole feed over bad art.
      # feedparser is the third: it is pure Python, installs anywhere, and
      # tests/test_bubbles_fixtures.py asserts that the captured bubbles.town feeds
      # (#173) survive feedparser's namespace flattening — the vote count reaches
      # `media_statistics`, not the nesting the XML actually uses. Those assertions
      # are importorskip-gated, so without it here the recon's "feedparser parses it
      # without loss" claim would quietly stop being checked.
      # mutagen is the fourth: it is pure Python and `mp3_duration_ms` imports it
      # function-locally. Every other test monkeypatches that seam, but the real-mix
      # tests in tests/test_music.py decode actual ffmpeg output and must call it —
      # without mutagen here they fail rather than skip, and the audio would go
      # unchecked in the one place the merge gate looks.
      # ruff is pinned exactly so CI matches the version validated locally and in
      # .pre-commit-config.yaml — a floating ruff can promote rules and redden CI.
      # Keep this in lockstep with the pre-commit rev and pyproject's `dev` extra.
      - name: Install dev tools
        run: python -m pip install "ruff==0.14.10" "pytest>=8.0" boto3 defusedxml Pillow feedparser mutagen

      # resolve_font's Linux fallbacks are DejaVu and Liberation. Installed
      # explicitly rather than assumed from the runner image: which fonts ship in
      # a hosted image is not a contract, and the cover test would otherwise go
      # red (or, worse, quietly stop covering anything) on an image refresh.
      - name: Install a cover font
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      # ffmpeg + ffprobe are what tests/test_music.py's real-mix tests decode with:
      # they assert the encoder profile, the planned duration and the actual audio
      # in the lead / story / tail regions. Guarded by shutil.which, so without this
      # step they silently SKIP — and the only test that proves the music mix is
      # correct would not be part of the merge gate.
      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Ruff lint
        run: ruff check .

      # Format is enforced: a format diff fails the job. The renderer's once
      # hand-tuned layout was reformatted to ruff format in one isolated commit
      # (see .git-blame-ignore-revs); the gate keeps the tree formatted from here on.
      - name: Ruff format
        run: ruff format --check .

      - name: Tests
        run: pytest
